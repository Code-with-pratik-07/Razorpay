services:
  - type: web
    name: recoverai-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recoverai-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "true"

databases:
  - name: recoverai-db
    databaseName: recoveraidb
    user: recoveraiuser
    plan: free
    region: oregon
